name: Build MeguAnimes

# HOW TO UPDATE THE APP (all from your phone, no commands):
#   1. In this repository tap  Add file > Upload files  and pick the new update.zip.
#      Keep the name update.zip: it replaces the old one.
#   2. Tap Commit changes. The build starts by itself (Actions tab, about 5 minutes).
#   3. Open Releases, then download the APK from the newest "Phone build".
#
# This builds project.zip with the files from update.zip laid on top.
# It never changes anything in your repository.
on:
  push:
    paths:
      - 'update.zip'
      - 'project.zip'
      - '.github/workflows/apply-update.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Get the repository
        uses: actions/checkout@v4

      - name: Unpack project.zip and lay update.zip on top
        run: |
          set -e
          if [ ! -f project.zip ]; then echo "project.zip is missing from the repository."; exit 1; fi
          rm -rf work
          mkdir work
          unzip -q -o project.zip -d work
          SETTINGS=$(find work -maxdepth 3 -name 'settings.gradle*' | head -n 1)
          if [ -z "$SETTINGS" ]; then echo "No Gradle project found inside project.zip."; exit 1; fi
          ROOT=$(dirname "$SETTINGS")
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"
          if [ -f update.zip ]; then
            if ! unzip -Z1 update.zip | grep -q '^app/'; then
              echo "update.zip has no app/ folder at its top level. Upload the update.zip you were given, unchanged."
              exit 1
            fi
            unzip -q -o update.zip -d "$ROOT"
            echo "Laid update.zip on top of project.zip."
          else
            echo "No update.zip found: building project.zip as it is."
          fi
          VERSION=$(grep -m1 'versionName' "$ROOT/app/build.gradle.kts" | sed 's/.*"\(.*\)".*/\1/')
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Project folder: $ROOT  Version: $VERSION"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n" >> "$ANDROID_HOME/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd\n" >> "$ANDROID_HOME/licenses/android-sdk-preview-license"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build the APK
        run: |
          cd "$ROOT"
          set +e
          gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
          STATUS=${PIPESTATUS[0]}
          if [ "$STATUS" -ne 0 ]; then
            # Put the real error messages on the run's summary page, where they are easy to find.
            python3 - <<'PY'
          import os, re
          log = open(os.path.join(os.environ["GITHUB_WORKSPACE"], "build.log"), errors="replace").read().splitlines()
          def esc(text):
              return text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          errs = [l for l in log if l.startswith("e: ") or " error: " in l or l.startswith("error:")]
          errs = [re.sub(r"file://\S*?/app/", "app/", l) for l in errs]
          if errs:
              print("::error title=Compiler errors::" + esc("\n".join(errs[:30])))
          out, grab = [], False
          for l in log:
              if l.startswith("* What went wrong"):
                  grab = True
                  continue
              if grab:
                  if l.startswith("* Try") or l.startswith("* Exception is"):
                      break
                  out.append(l)
          if out:
              print("::error title=What went wrong::" + esc("\n".join(out[:20])))
          PY
          fi
          exit "$STATUS"

      - name: Publish the APK under Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          APK="MeguAnimes-${VERSION}-build${{ github.run_number }}.apk"
          cp "$ROOT/app/build/outputs/apk/debug/app-debug.apk" "$APK"
          TAG="phone-${{ github.run_number }}"
          if [ "${{ github.run_attempt }}" != "1" ]; then TAG="$TAG-retry${{ github.run_attempt }}"; fi
          gh release create "$TAG" "$APK" \
            --title "Phone build ${{ github.run_number }} (version ${VERSION})" \
            --notes "MeguAnimes ${VERSION}, built from project.zip plus update.zip." \
            --latest
