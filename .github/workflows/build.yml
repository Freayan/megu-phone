name: Build debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the repository
        uses: actions/checkout@v4

      - name: Unpack project.zip
        run: |
          rm -rf src_project
          mkdir src_project
          unzip -q project.zip -d src_project
          ls src_project

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build debug APK
        working-directory: src_project
        run: gradle assembleDebug --stacktrace

      - name: Name the APK
        run: cp src_project/app/build/outputs/apk/debug/app-debug.apk MeguAnimes-debug.apk

      - name: Keep the APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MeguAnimes-debug-apk
          path: MeguAnimes-debug.apk

      - name: Publish the APK as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          prerelease: true
          files: MeguAnimes-debug.apk
